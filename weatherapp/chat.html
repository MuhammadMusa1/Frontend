<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-бот с шутками</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Чат-бот с шутками</h1>
            <p class="subtitle">Напишите "шутка", "смех" или "расскажи" чтобы получить шутку!</p>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    <div class="message-content">
                        Привет! Я бот с шутками 😄 Напиши "шутка", "смех" или "расскажи" и я расскажу тебе смешную шутку!
                    </div>
                    <div class="message-time" id="currentTime"></div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Напишите сообщение..."
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="sendMessage()">📤</button>
        </div>

        <div class="quick-buttons">
            <button onclick="quickCommand('шутка')">🎭 Шутка</button>
            <button onclick="quickCommand('смех')">😂 Смех</button>
            <button onclick="quickCommand('расскажи')">📖 Расскажи</button>
            <button onclick="quickCommand('помощь')">❓ Помощь</button>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
