<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глоссарий веб-разработчика</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 30px;
            overflow: hidden;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .search-box {
            display: flex;
            margin-bottom: 20px;
            max-width: 500px;
            margin: 0 auto 25px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            border-color: #6e8efb;
        }
        
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .category-btn {
            padding: 10px 20px;
            background-color: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .category-btn.active, .category-btn:hover {
            background-color: #6e8efb;
            color: white;
        }
        
        .glossary {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .term-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            border-left: 4px solid #6e8efb;
        }
        
        .term-card:hover {
            transform: translateY(-5px);
        }
        
        .term-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .term-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .term-category {
            background-color: #e0e7ff;
            color: #6e8efb;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .term-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .term-example {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            overflow-x: auto;
            border-left: 3px solid #6e8efb;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
            grid-column: 1 / -1;
        }
        
        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            color: #ccc;
        }
        
        @media (max-width: 768px) {
            .glossary {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <header>
                <h1><i class="fas fa-book"></i> Глоссарий веб-разработчика</h1>
                <p>Основные теги и элементы HTML, CSS, JavaScript и Vue.js</p>
                
                <div class="search-box">
                    <input 
                        type="text" 
                        placeholder="Поиск по терминам..." 
                        v-model="searchQuery"
                    >
                </div>
                
                <div class="categories">
                    <button 
                        v-for="category in categories" 
                        :key="category" 
                        :class="['category-btn', { active: selectedCategory === category }]"
                        @click="toggleCategory(category)"
                    >
                        {{ category }}
                    </button>
                </div>
            </header>
            
            <div class="glossary">
                <div 
                    v-for="term in filteredTerms" 
                    :key="term.name" 
                    class="term-card"
                >
                    <div class="term-header">
                        <h3 class="term-name">{{ term.name }}</h3>
                        <span class="term-category">{{ term.category }}</span>
                    </div>
                    <p class="term-description">{{ term.description }}</p>
                    <div class="term-example" v-if="term.example">
                        {{ term.example }}
                    </div>
                </div>
                
                <div class="empty-state" v-if="filteredTerms.length === 0">
                    <i class="fas fa-search"></i>
                    <h3>Ничего не найдено</h3>
                    <p>Попробуйте изменить поисковый запрос или выбрать другую категорию</p>
                </div>
            </div>
        </div>
    </div>

            computed: {
                filteredTerms() {
                    let filtered = this.terms;
                    
                    // Фильтрация по категории
                    if (this.selectedCategory !== 'Все') {
                        filtered = filtered.filter(term => term.category === this.selectedCategory);
                    }
                    
                    // Фильтрация по поисковому запросу
                    if (this.searchQuery) {
                        const query = this.searchQuery.toLowerCase();
                        filtered = filtered.filter(term => 
                            term.name.toLowerCase().includes(query) ||
                            term.description.toLowerCase().includes(query) ||
                            term.category.toLowerCase().includes(query)
                        );
                    }
                    
                    return filtered;
                }
            },
            methods: {
                toggleCategory(category) {
                    this.selectedCategory = this.selectedCategory === category ? 'Все' : category;
                }
            }
