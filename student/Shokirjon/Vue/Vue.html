<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список дел</title>
    <link rel="stylesheet" href="Vue.css">
</head>
<body>
    <div id="app" class="container">
        <h1>Список дел</h1>
        <div class="task-form">
            <input v-model="newTask" @keyup.enter="addTask" placeholder="Введите задачу...">
            <button @click="addTask">Добавить</button>
        </div>
        <div class="task-list">
            <div v-for="task in tasks" :key="task.id" class="task-card" :class="{ completed: task.completed }">
                <span v-if="!task.isEditing" @click="toggleTask(task.id)">{{ task.text }}</span>
                <input v-else v-model="task.text" @keyup.enter="saveEdit(task)" @blur="saveEdit(task)">
                <button @click="toggleTask(task.id)">{{ task.completed ? 'Отменить' : 'Выполнено' }}</button>
                <button class="edit" @click="editTask(task)">{{ task.isEditing ? 'Сохранить' : 'Редактировать' }}</button>
                <button @click="deleteTask(task.id)">Удалить</button>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="Vue.js"></script>
        
</body>
</html>
