<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кредитный калькулятор</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
}

.calculator {
    background-color: #fff;
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    max-width: 400px;
    width: 100%;
    text-align: center;
}

h1 {
    font-size: 1.8rem;
    margin-bottom: 1.5rem;
    color: #333;
}

.form-group {
    margin-bottom: 1rem;
    text-align: left;
}

label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: bold;
    color: #555;
}

input {
    width: 100%;
    padding: 0.5rem;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 5px;
    outline: none;
}

input:focus {
    border-color: #007bff;
}

button {
    width: 100%;
    padding: 0.75rem;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.3s;
}

button:hover {
    background-color: #0056b3;
}

.result {
    margin-top: 2rem;
    padding: 1rem;
    background-color: #f9f9f9;
    border-radius: 5px;
}

.result.hidden {
    display: none;
}

.result h2 {
    font-size: 1.5rem;
    margin-bottom: 1rem;
}

.result p {
    margin-bottom: 0.5rem;
    color: #333;
}

@media (max-width: 400px) {
    .calculator {
        padding: 1rem;
    }

    h1 {
        font-size: 1.5rem;
    }
}
</style>
    <div class="calculator">
        <h1>Кредитный калькулятор</h1>
        <form id="loan-form">
            <div class="form-group">
                <label for="amount">Сумма кредита (Сомони):</label>
                <input type="number" id="amount" min="1000" required>
            </div>
            <div class="form-group">
                <label for="interest">Годовая процентная ставка (%):</label>
                <input type="number" id="interest" min="0" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="years">Срок кредита (лет):</label>
                <input type="number" id="years" min="1" required>
            </div>
            <button type="submit">Рассчитать</button>
        </form>

        <div id="result" class="result hidden">
            <h2>Результат</h2>
            <p>Ежемесячный платеж: <span id="monthly-payment"></span> Сомони</p>
            <p>Общая сумма выплат: <span id="total-payment"></span> Сомони</p>
            <p>Переплата по кредиту: <span id="total-interest"></span>Сомони</p>
        </div>
    </div>

<script>
    document.getElementById('loan-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const amount = parseFloat(document.getElementById('amount').value);
    const interest = parseFloat(document.getElementById('interest').value) / 100 / 12; // Месячная ставка
    const years = parseInt(document.getElementById('years').value);
    const months = years * 12;

   
    const x = Math.pow(1 + interest, months);
    const monthly = (amount * x * interest) / (x - 1);

    if (isFinite(monthly)) {
        const monthlyPayment = monthly.toFixed(2);
        const totalPayment = (monthly * months).toFixed(2);
        const totalInterest = (totalPayment - amount).toFixed(2);
document.getElementById('monthly-payment').textContent = monthlyPayment;
document.getElementById('total-payment').textContent = totalPayment;     document.getElementById('total-interest').textContent = totalInterest;
document.getElementById('result').classList.remove('hidden');
    } else {
        alert('Пожалуйста, проверьте введенные данные.');
    }
});
</script>
</body>
</html>
