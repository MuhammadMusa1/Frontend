<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Студент Ойшахон</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            background: linear-gradient(120deg, #e0eafc 0%, #cfdef3 100%);
        }
        .container { 
            max-width: 700px; 
            margin: 48px auto; 
            background: #fff; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 4px 24px rgba(42,122,226,0.15); 
            transition: box-shadow 0.3s;
        }
        .container:hover {
            box-shadow: 0 8px 32px rgba(42,122,226,0.25);
        }
        h1 { 
            color: #2a7ae2; 
            text-align: center; 
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        h2 {
            color: #1e4a7b;
            margin-top: 32px;
            border-bottom: 2px solid #e0eafc;
            padding-bottom: 8px;
        }
        p { 
            font-size: 1.15em; 
            color: #444;
            text-align: center;
        }
        .info ul {
            list-style: none;
            padding: 0;
        }
        .info li {
            background: #f0f6ff;
            margin: 10px 0;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 1.08em;
            box-shadow: 0 1px 4px #e0eafc;
            transition: background 0.2s;
        }
        .info li:hover {
            background: #d4e3fc;
        }
        .btn {
            display: inline-block;
            margin: 24px auto 0 auto;
            padding: 12px 28px;
            background: #2a7ae2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            box-shadow: 0 2px 8px #b3c6e7;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            background: #1e4a7b;
            box-shadow: 0 4px 16px #b3c6e7;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #888;
            font-size: 0.95em;
        }
        @media (max-width: 600px) {
            .container { padding: 16px; }
            h1 { font-size: 1.5em; }
            h2 { font-size: 1.1em; }
        }
        .hidden {
            display: none;
        }
        .success {
            color: #2a7ae2;
            font-weight: bold;
            margin-top: 12px;
        }
    </style>
    <script>
        function showGreeting() {
            alert('Привет, Ойшахон! Успехов в обучении!');
        }

        function toggleInfo() {
            const info = document.querySelector('.info');
            info.classList.toggle('hidden');
        }

        function changeTheme() {
            document.body.style.background = 
                document.body.style.background.includes('e0eafc') ?
                'linear-gradient(120deg, #fceabb 0%, #f8b500 100%)' :
                'linear-gradient(120deg, #e0eafc 0%, #cfdef3 100%)';
        }

        function showSuccess(msg) {
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = msg;
            successDiv.classList.remove('hidden');
            setTimeout(() => successDiv.classList.add('hidden'), 2000);
        }

        function addInfoItem() {
            const ul = document.querySelector('.info ul');
            const input = document.getElementById('newInfo');
            if (input.value.trim()) {
                const li = document.createElement('li');
                li.textContent = input.value;
                ul.appendChild(li);
                showSuccess('Добавлено!');
                input.value = '';
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать!</h1>
        <p>Это пример веб-страницы для студента Ойшахон.</p>
        <button class="btn" onclick="showGreeting()">Поздороваться</button>
        <button class="btn" onclick="toggleInfo()">Показать/Скрыть информацию</button>
        <button class="btn" onclick="changeTheme()">Сменить тему</button>
        <div id="successMsg" class="success hidden"></div>
        <div style="margin-top:24px;">
            <input id="newInfo" type="text" placeholder="Добавить информацию..." style="padding:8px; border-radius:4px; border:1px solid #e0eafc; width:60%;">
            <button class="btn" onclick="addInfoItem()" style="padding:8px 16px; font-size:0.95em;">Добавить</button>
        </div>
        <div class="info">
            <h2>Информация</h2>
            <ul>
                <li>Имя: Ойшахон</li>
                <li>Группа: Frontend</li>
                <li>Задание: Создать веб-страницу</li>
            </ul>
        </div>
    </div>
    <div class="footer">
        &copy; 2024 Ойшахон. Все права защищены.
    </div>
</body>
</html>
