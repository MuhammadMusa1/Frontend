<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Простое и удобное приложение для управления задачами">
    <title>ToDo List - Менеджер задач</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div id="todoApp">
            <header class="app-header">
                <h1>📝 ToDo Список</h1>
                <p class="tasks-counter">Задач: <span id="tasksCount">0</span></p>
            </header>
            
            <main class="app-main">
                <form id="todoForm" class="todo-form">
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="todoInput" 
                            placeholder="Добавить новую задачу..." 
                            aria-label="Текст новой задачи"
                            maxlength="200"
                        />
                        <button type="submit" id="addBtn" aria-label="Добавить задачу">
                            <span class="btn-text">+ Добавить</span>
                            <span class="btn-loading">⏳</span>
                        </button>
                    </div>
                </form>

                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="active">Активные</button>
                    <button class="filter-btn" data-filter="completed">Выполненные</button>
                </div>

                <div class="todo-container">
                    <ul id="todoList" class="todo-list"></ul>
                    <div id="emptyState" class="empty-state">
                        <div class="empty-icon">📄</div>
                        <h3>Список пуст</h3>
                        <p>Добавьте первую задачу выше</p>
                    </div>
                </div>
            </main>

            <footer class="app-footer">
                <div class="footer-info">
                    <span>Задач выполнено: <span id="completedCount">0</span></span>
                    <button id="clearCompleted" class="clear-btn">Очистить выполненные</button>
                </div>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
