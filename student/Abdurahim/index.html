<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор мемов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎭 Генератор Мемов</h1>
        
        <div class="upload-section">
            <input type="file" id="imageUpload" accept="image/*" class="hidden">
            <button class="upload-btn" onclick="document.getElementById('imageUpload').click()">
                📁 Выбрать изображение
            </button>
        </div>

        <div class="examples-section">
            <h3>Быстрые примеры:</h3>
            <div class="example-buttons">
                <button class="example-btn" onclick="loadExample(0)">Драконий мем</button>
                <button class="example-btn" onclick="loadExample(1)">Котик мем</button>
            </div>
        </div>

        <div class="text-inputs">
            <input type="text" id="topText" placeholder="Введите верхний текст...">
            <input type="text" id="bottomText" placeholder="Введите нижний текст...">
        </div>

        <button class="generate-btn" onclick="generateMeme()">
            🎨 Сгенерировать мем
        </button>

        <div class="meme-container">
            <canvas id="memeCanvas" width="500" height="300"></canvas>
            <div id="topTextDisplay" class="meme-text top-text"></div>
            <div id="bottomTextDisplay" class="meme-text bottom-text"></div>
        </div>

        <button class="download-btn" onclick="downloadMeme()">
            💾 Скачать мем
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
