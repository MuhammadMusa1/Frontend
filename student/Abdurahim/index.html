<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор мемов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎨 Генератор Мемов</h1>
        
        <div class="control-panel">
            <div class="upload-section">
                <input type="file" id="imageUpload" accept="image/*" class="hidden">
                <button class="btn upload-btn" onclick="document.getElementById('imageUpload').click()">
                    📁 Загрузить изображение
                </button>
            </div>

            <div class="examples-section">
                <h3>Примеры:</h3>
                <div class="example-buttons">
                    <button class="btn example-btn" onclick="loadExample(0)">Драконий мем</button>
                    <button class="btn example-btn" onclick="loadExample(1)">Котик мем</button>
                </div>
            </div>

            <div class="text-controls">
                <div class="text-input-group">
                    <input type="text" id="newText" placeholder="Введите текст...">
                    <select id="fontSize">
                        <option value="24">24px</option>
                        <option value="32" selected>32px</option>
                        <option value="40">40px</option>
                        <option value="48">48px</option>
                    </select>
                    <input type="color" id="textColor" value="#ffffff">
                    <button class="btn add-text-btn" onclick="addTextBox()">➕ Добавить текст</button>
                </div>
            </div>
        </div>

        <div class="meme-container" id="memeContainer">
            <canvas id="memeCanvas" width="600" height="400"></canvas>
        </div>

        <div class="action-buttons">
            <button class="btn generate-btn" onclick="generateMeme()">🎨 Обновить мем</button>
            <button class="btn download-btn" onclick="downloadMeme()">💾 Скачать мем</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
