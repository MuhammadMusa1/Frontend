<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f0f2f5;
}

.joke-container {
    text-align: center;
    background-color: #fff;
    padding: 30px 50px;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    max-width: 500px;
}

h1 {
    color: #333;
}

#joke-display {
    font-size: 1.2em;
    min-height: 50px;
    color: #555;
}

#joke-button {
    background-color: #007bff;
    color: #fff;
    border: none;
    padding: 10px 20px;
    font-size: 1em;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

#joke-button:hover {
    background-color: #0056b3;
}
    </style>
</head>
<body>
        <div class="joke-container">
        <h1>Твой личный бот-шутник! 🤣</h1>
        <p id="joke-display">Нажми на кнопку, чтобы получить новую шутку!</p>
        <button id="joke-button">Получить шутку</button>
    </div>
     <script>
        // Array of jokes for the bot to tell
        const jokes = [
            "Почему рыбаки такие плохие боксёры? Потому что они постоянно ловят крюк.",
            "Что общего между таксистом и учителем? У них у обоих есть счётчик.",
            "Какая самая любимая игра у программистов? \"Покемоны\". Потому что они постоянно ловят баги.",
            "Почему спички не любят ходить в школу? Потому что они боятся огня.",
            "Почему у скелета нет друзей? Потому что у него нет тела.",
            "Почему у пчёл всегда хорошее настроение? Потому что у них есть мёд.",
            "Что сказал ноль восьмёрке? \"Классный пояс!\"",
            "Почему книги никогда не спорят? Потому что у них всегда есть свои страницы.",
            "Почему у компьютера нет друзей? Потому что он боится вирусов.",
            "Что говорит компьютер, когда хочет отдохнуть? \"Мне нужно перезагрузиться\".",
            "Почему слоны не играют в прятки? Потому что они всегда проигрывают.",
            "Почему пчёлы не летают в космос? Потому что у них нет скафандров.",
            "Что говорит снежный человек, когда видит себя в зеркале? \"Это я\".",
            "Что такое \"истина\"? Это то, что ты не можешь найти в интернете.",    
            "Где спят коровы? На ферме.",
            "Почему повара такие плохие слушатели? Потому что они постоянно что-то подслушивают.",
            "Почему у математика всегда хорошее настроение? Потому что у него есть решение для всего.",
            "Почему у музыканта всегда много друзей? Потому что у него есть ноты.",
            "Что говорит один ноль другому? «Стой, мне нужно перезагрузиться».",    
            "Почему снежный человек такой стеснительный? Потому что он боится, что его растают.",
            "Что делает пчела на работе? Она жужжит.",
            "Что общего между пиратом и актёром? Оба ищут сокровище.",

        ];

        // Get references to the HTML elements
        const jokeDisplay = document.getElementById('joke-display');
        const jokeButton = document.getElementById('joke-button');

        // Add a click event listener to the button
        jokeButton.addEventListener('click', () => {
            // Generate a random index to pick a joke from the array
            const randomIndex = Math.floor(Math.random() * jokes.length);

            // Get the joke at the random index
            const randomJoke = jokes[randomIndex];

            // Update the text content of the joke display element
            jokeDisplay.textContent = randomJoke;
        });

    </script>
</body>
</html
