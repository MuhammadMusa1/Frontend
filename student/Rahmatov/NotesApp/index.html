<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Простое приложение для создания и управления заметками">
  <title>Список заметок</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Мои заметки</h1>
    </header>

    <main>
      <div class="input-section">
        <input 
          type="text" 
          id="note-input" 
          placeholder="Введите текст заметки..." 
          aria-label="Текст новой заметки"
        />
        <button id="add-btn" aria-label="Добавить заметку">
          <span>+ Добавить</span>
        </button>
      </div>

      <div class="notes-container">
        <ul id="note-list"></ul>
        <div id="empty-state" class="empty-state">
          <p>📄 Пока нет заметок</p>
          <p>Добавьте первую заметку выше</p>
        </div>
      </div>
    </main>

    <footer>
      <p>Всего заметок: <span id="notes-count">0</span></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
