<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пример 3: Сохранение списка</title>
</head>
<body>

    <h1>Сохрани свои любимые фрукты</h1>
    <input type="text" id="fruitInput" placeholder="Введите фрукт">
    <button onclick="addFruit()">Добавить</button>
    <button onclick="saveFruits()">Сохранить список</button>
    <p id="message"></p>

    <script>
        let myFruits = [];

        function addFruit() {
            const fruit = document.getElementById('fruitInput').value;
            myFruits.push(fruit);
            document.getElementById('fruitInput').value = ''; // Очищаем поле
            document.getElementById('message').textContent = `Добавлено: ${myFruits.join(', ')}`;
        }

        function saveFruits() {
            // 1. Превращаем массив в JSON-строку
            const jsonFruits = JSON.stringify(myFruits);
            // 2. Сохраняем строку в localStorage
            localStorage.setItem('favoriteFruits', jsonFruits);
            document.getElementById('message').textContent = 'Список сохранен!';
        }
    </script>
</body>
</html>
