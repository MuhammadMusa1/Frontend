<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пример 2: Загрузка данных</title>
</head>
<body>

    <h1>Привет, <span id="userName">Гость</span>!</h1>

    <script>
        // 1. Получаем имя из localStorage
        const userName = localStorage.getItem('username');
        // 2. Проверяем, существует ли имя
        if (userName) {
            // 3. Если да, обновляем заголовок
            document.getElementById('userName').textContent = userName;
        }
    </script>
</body>
</html>
