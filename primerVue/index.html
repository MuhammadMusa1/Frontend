<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач на Vue.js</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        #app {
            margin-top: 30px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .task-input {
            display: flex;
            margin-bottom: 20px;
        }
        .task-input input {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
        }
        .task-input button {
            padding: 10px 15px;
            background-color: #42b983;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }
        .task-list {
            list-style: none;
            padding: 0;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .task-item.completed {
            text-decoration: line-through;
            color: #aaa;
        }
        .task-text {
            flex-grow: 1;
            cursor: pointer;
        }
        .task-remove {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .filters {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .filter-btn {
            margin: 0 5px;
            padding: 5px 10px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        .filter-btn.active {
            background-color: #42b983;
            color: white;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Мой Список Задач</h1>
        
        <div class="task-input">
            <input 
                type="text" 
                v-model="newTaskText" 
                placeholder="Добавить новую задачу"
                @keyup.enter="addTask"
            >
            <button @click="addTask">Добавить</button>
        </div>
        
        <ul class="task-list">
            <li 
                v-for="(task, index) in filteredTasks" 
                :key="index" 
                class="task-item"
                :class="{ completed: task.isCompleted }"
            >
                <span class="task-text" @click="toggleCompletion(task)">
                    {{ task.text }}
                </span>
                <button class="task-remove" @click="removeTask(index)">
                    Удалить
                </button>
            </li>
        </ul>
        
        <div class="filters">
            <button 
                class="filter-btn" 
                :class="{ active: filter === 'all' }"
                @click="filter = 'all'"
            >
                Все
            </button>
            <button 
                class="filter-btn"
                :class="{ active: filter === 'active' }"
                @click="filter = 'active'"
            >
                Активные
            </button>
            <button 
                class="filter-btn"
                :class="{ active: filter === 'completed' }"
                @click="filter = 'completed'"
            >
                Выполненные
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
