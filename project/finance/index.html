<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Финансами</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Финансовый Учёт</h1>

        <div class="balance-container">
            <h3>Ваш Баланс</h3>
            <h1 id="balance">0 ₽</h1>
            
            <div class="income-expense-container">
                <div class="income-box">
                    <h4>Доходы</h4>
                    <p id="income-amount">0 ₽</p>
                </div>
                <div class="expense-box">
                    <h4>Расходы</h4>
                    <p id="expense-amount">0 ₽</p>
                </div>
            </div>
        </div>

        <h3>Добавить новую транзакцию</h3>
        <form id="transaction-form">
            <div class="form-control">
                <label for="text">Описание</label>
                <input type="text" id="text" placeholder="Введите описание..." />
            </div>
            <div class="form-control">
                <label for="amount">Сумма <br /> (минус для расходов)</label>
                <input type="number" id="amount" placeholder="Введите сумму..." />
            </div>
            <button class="btn">Добавить транзакцию</button>
        </form>

        <h3>История</h3>
        <ul id="list" class="list">
            </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
