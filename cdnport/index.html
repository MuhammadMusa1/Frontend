<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Портфолио на Vue.js</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <img class="avatar" src="photo_2025-08-15_09-01-42.jpg" alt="Ваше фото">
      <h1>{{ name }}</h1>
      <p>{{ title }}</p>
    </header>
    <div class="container">
      <section class="about">
        <h2>Обо мне</h2>
        <p>{{ about }}</p>
      </section>
      <section class="skills">
        <h2>Навыки</h2>
        <div class="skills-list">
          <span class="skill" v-for="skill in skills" :key="skill">{{ skill }}</span>
        </div>
      </section>
      <section>
        <h2>Проекты</h2>
        <div class="projects">
          <div class="project" v-for="project in projects" :key="project.name">
            <h3>{{ project.name }}</h3>
            <p>{{ project.description }}</p>
            <a :href="project.link" target="_blank">Смотреть проект</a>
          </div>
        </div>
      </section>
      <section style="margin-top:2rem;">
        <h2>Контакты</h2>
        <p>Email: <a :href="'mailto:' + email">{{ email }}</a></p>
        <p>GitHub: <a :href="github" target="_blank">{{ githubUser }}</a></p>
      </section>
    </div>
  </div>
  <script src="app1.js"></script>
</body>
</html>
