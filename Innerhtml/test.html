<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список комментарий</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Список комментариев</h1>
        <p>Добавляй  свои комментарий</p>
        <form id="commentForm">
            <input type="text" id="commentInput" placeholder="Введи комментарий" required>
            <button type="submit">Добавить</button>
        </form>
        <div id="commentList"></div>

    </div>
    

    <script src="script.js"></script>
</body>
</html>
